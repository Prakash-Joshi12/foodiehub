<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Delivery Tracking — FoodieNepal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body{padding:0}
  .track-header{padding:16px 5%;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(14,10,7,.9);backdrop-filter:blur(10px);z-index:10}
  .track-wrap{max-width:1100px;margin:auto;padding:16px 5% 50px}
  #map{height:60vh}
  .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--success);margin-right:6px;box-shadow:0 0 0 rgba(66,184,131,.6);animation:pulseRing 1.6s infinite}
  .pulse-marker-icon{width:18px;height:18px;border-radius:50%;background:var(--accent-2);border:3px solid #fff;box-shadow:0 0 0 rgba(226,88,43,.5);position:relative}
  .pulse-marker-icon::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent-2);animation:ping 1.6s ease-out infinite}
</style>
</head>
<body>
<div class="track-header">
  <div style="max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center">
    <b style="font-size:18px">🍽️ FoodieNepal — Live Tracking</b>
    <span id="statusBadge" class="status-badge s-placed">Loading…</span>
  </div>
</div>

<div class="track-wrap">
  <h1 style="font-size:22px"><span class="live-dot"></span>Order #<span id="oid">—</span></h1>
  <p style="color:var(--text-dim)" id="subtitle">Connecting to delivery partner…</p>

  <div class="timeline" id="timeline"></div>

  <div id="map"></div>
  <p style="color:var(--text-faint);font-size:12.5px;margin-top:10px">Updates automatically every 5 seconds. Keep this tab open to follow your order in real time.</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const oid=new URLSearchParams(location.search).get('order');
document.getElementById('oid').textContent=oid||'—';

const STATUS_CSS={"Placed":"s-placed","Confirmed":"s-confirmed","Preparing":"s-preparing","Ready":"s-ready",
  "Assigned":"s-assigned","Picked Up":"s-picked","On the Way":"s-way","Delivered":"s-delivered","Cancelled":"s-cancelled"};
const FLOW=["Placed","Confirmed","Preparing","Ready","Assigned","Picked Up","On the Way","Delivered"];

let map=L.map('map').setView([28.3949,84.1240],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let marker=null, trail=null, customerMarker=null, fitted=false;

function renderTimeline(status){
  const idx=FLOW.indexOf(status);
  const el=document.getElementById('timeline');
  if(status==='Cancelled'){ el.innerHTML='<div class="hint danger">❌ This order was cancelled.</div>'; return; }
  el.innerHTML=FLOW.map((s,i)=>`
    <div class="step ${i<idx?'done':''} ${i===idx?'current':''}">
      <div class="line"></div>
      <div class="dot">${i<idx?'✓':''}</div>
      <small>${s}</small>
    </div>`).join('');
}

async function load(){
  if(!oid) return;
  try{
    const r=await fetch('/api/orders/'+oid+'/track');
    if(!r.ok) return;
    const d=await r.json();

    const badge=document.getElementById('statusBadge');
    badge.textContent=d.status;
    badge.className='status-badge '+(STATUS_CSS[d.status]||'s-placed');
    renderTimeline(d.status);

    const sub=document.getElementById('subtitle');
    if(d.status==='Delivered') sub.textContent='Delivered! Enjoy your meal 🎉';
    else if(d.status==='Cancelled') sub.textContent='This order was cancelled.';
    else if(!d.points.length) sub.textContent='Waiting for the delivery partner to start sharing location…';
    else sub.textContent='Your delivery partner is on the move.';

    if(d.customer_lat && d.customer_lng && !customerMarker){
      customerMarker=L.marker([d.customer_lat,d.customer_lng]).addTo(map).bindPopup('📍 Delivery address');
    }

    if(d.points.length){
      const latlngs=d.points.map(p=>[p.lat,p.lng]);
      const last=latlngs[latlngs.length-1];
      if(!marker){
        const icon=L.divIcon({className:'',html:'<div class="pulse-marker-icon"></div>',iconSize:[18,18]});
        marker=L.marker(last,{icon}).addTo(map).bindPopup('🛵 Delivery partner');
      } else {
        marker.setLatLng(last);
      }
      if(trail) map.removeLayer(trail);
      trail=L.polyline(latlngs,{color:'#f0a43a',weight:3,opacity:.8,dashArray:'6,8'}).addTo(map);
      if(!fitted){
        const bounds=L.latLngBounds(latlngs);
        if(customerMarker) bounds.extend(customerMarker.getLatLng());
        map.fitBounds(bounds,{padding:[40,40]});
        fitted=true;
      } else {
        map.panTo(last);
      }
    }
  }catch(e){}
}
load();
setInterval(load,5000);
</script>
</body>
</html>
